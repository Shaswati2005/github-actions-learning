name: CI

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm ci
      working-directory: sample-app
    - name: Run tests
      run: npm test
      working-directory: sample-app
    - name: Build
      run: npm run build
      working-directory: sample-app
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-build
        path: sample-app/dist
