name: Build and Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'sample-app/**'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'sample-app/package.json'
      
      - name: Install dependencies
        working-directory: ./sample-app
        run: npm ci || npm install
      
      - name: Run linter
        working-directory: ./sample-app
        run: npm run lint
        continue-on-error: true
      
      - name: Build application
        working-directory: ./sample-app
        run: npm run build
      
      - name: Run tests
        working-directory: ./sample-app
        run: npm test
      
      - name: Upload coverage reports
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: sample-app/coverage/
          retention-days: 30
      
      - name: Check coverage
        if: always()
        working-directory: ./sample-app
        run: |
          if [ -d coverage ]; then
            echo "✅ Coverage report generated"
          else
            echo "⚠️ No coverage directory found"
          fi

  lint-check:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'sample-app/package.json'
      
      - name: Install dependencies
        working-directory: ./sample-app
        run: npm ci || npm install
      
      - name: Run ESLint
        working-directory: ./sample-app
        run: npm run lint
        continue-on-error: true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, lint-check]
    if: always()
    
    steps:
      - name: Print test results
        run: |
          echo "🎯 Test Run Summary"
          echo "==================="
          echo "Build & Test Result: ${{ needs.build-and-test.result }}"
          echo "Lint Check Result: ${{ needs.lint-check.result }}"
          echo "✅ All jobs completed"
